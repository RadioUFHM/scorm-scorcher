<style>
  #certificate-view {
    --cert-navy: #0d1b2a;
    --cert-gold: #b08d57;
    position: relative;
    max-width: 960px;
    aspect-ratio: 11 / 8.5;
    margin: 32px auto 48px;
    padding: 14px;
    background: #fff;
    border: 6px double var(--cert-navy);
    font-family: Georgia, "Times New Roman", Times, serif;
    color: #222;
  }
  #certificate-view .cert-inner {
    height: 100%;
    border: 1.5px solid var(--cert-gold);
    padding: 4% 7% 3%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
  }
  #certificate-view .cert-logo { max-height: 90px; max-width: 45%; object-fit: contain; }
  #certificate-view .cert-title {
    margin: 0;
    font-size: clamp(1.3rem, 3.4vw, 2.3rem);
    font-weight: normal;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--cert-navy);
  }
  #certificate-view .cert-rule {
    width: 90px; height: 2px; background: var(--cert-gold); border: 0; margin: 0.5em auto 0;
  }
  #certificate-view .cert-intro,
  #certificate-view .cert-completed {
    margin: 0;
    font-style: italic;
    font-size: clamp(0.85rem, 1.6vw, 1.1rem);
    color: #555;
  }
  #certificate-view .cert-name {
    margin: 0;
    min-width: 60%;
    padding: 0 0.5em 0.2em;
    border-bottom: 1px solid #999;
    font-size: clamp(1.6rem, 4.4vw, 3rem);
    font-style: italic;
    color: var(--cert-navy);
  }
  #certificate-view .cert-course {
    margin: 0;
    font-size: clamp(1rem, 2.4vw, 1.6rem);
    font-weight: bold;
    color: #222;
  }
  #certificate-view .cert-score { margin: 0; font-size: clamp(0.8rem, 1.4vw, 1rem); color: #444; }
  #certificate-view .cert-sign-row {
    width: 100%;
    display: flex;
    justify-content: space-around;
    gap: 8%;
  }
  #certificate-view .cert-sign { flex: 0 1 38%; }
  #certificate-view .cert-sign-value {
    min-height: 1.4em;
    padding-bottom: 0.2em;
    border-bottom: 1px solid #444;
    font-size: clamp(0.85rem, 1.6vw, 1.1rem);
  }
  #certificate-view .cert-sign-label {
    margin-top: 0.3em;
    font-size: clamp(0.7rem, 1.2vw, 0.85rem);
    color: #555;
    line-height: 1.35;
  }
  @media (max-width: 640px) {
    #certificate-view { aspect-ratio: auto; margin: 24px 8px 48px; padding: 8px; }
    #certificate-view .cert-inner { gap: 14px; padding: 24px 16px; }
    #certificate-view .cert-sign-row { flex-direction: column; align-items: center; gap: 14px; }
    #certificate-view .cert-sign { width: 80%; }
  }
  #cert-actions { max-width: 960px; margin: -36px auto 48px; text-align: right; }
  #cert-actions .retry-btn { margin-top: 0; }

  #cert-name-form {
    max-width: 520px;
    margin: 24px auto;
    padding: 20px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: Arial, Helvetica, sans-serif;
  }
  #cert-name-form label { display: block; font-weight: bold; margin-bottom: 8px; color: #0d1b2a; }
  #cert-name-form input {
    width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px;
  }
  #cert-name-form .cert-name-help { font-size: 0.85rem; color: #666; margin: 8px 0 0; }

  @media print {
    @page { size: letter landscape; margin: 0.4in; }
    body > *:not(#certificate-view) { display: none !important; }
    body { background: #fff !important; }
    #certificate-view {
      max-width: none;
      width: 100%;
      height: 7.6in;
      aspect-ratio: auto;
      margin: 0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    #certificate-view .cert-title { font-size: 30pt; }
    #certificate-view .cert-name { font-size: 38pt; }
    #certificate-view .cert-course { font-size: 20pt; }
    #certificate-view .cert-intro,
    #certificate-view .cert-completed { font-size: 14pt; }
    #certificate-view .cert-score,
    #certificate-view .cert-sign-value { font-size: 12pt; }
    #certificate-view .cert-sign-label { font-size: 10pt; }
  }
</style>

<form id="cert-name-form" class="hidden" onsubmit="submitCertificateName(event)">
  <label for="cert-name-input">Your name as it should appear on your certificate</label>
  <input id="cert-name-input" type="text" maxlength="80" autocomplete="name" required />
  <p class="cert-name-help">Type your full name, then press the button.</p>
  <button type="submit" class="retry-btn">Show My Certificate</button>
</form>

<div id="certificate-view" class="hidden" aria-label="Certificate of Completion">
  <div class="cert-inner">
    {{CERT_LOGO}}
    <div>
      <h2 class="cert-title">Certificate of Completion</h2>
      <hr class="cert-rule" />
    </div>
    <p class="cert-intro">This certifies that</p>
    <p class="cert-name" id="cert-name"></p>
    <p class="cert-completed">has successfully completed</p>
    <p class="cert-course" id="cert-course"></p>
    <p class="cert-score" id="cert-score"></p>
    <div class="cert-sign-row">
      {{CERT_SIGNER}}
      <div class="cert-sign">
        <div class="cert-sign-value" id="cert-date"></div>
        <div class="cert-sign-label">Date</div>
      </div>
    </div>
  </div>
</div>
<div id="cert-actions" class="hidden">
  <button class="retry-btn cert-print-btn" onclick="window.print()">Print / Save as PDF</button>
</div>

<script>
  /* Best-effort "Last, First" -> "First Last" reformat for display; falls
     back to the raw SCORM value unmodified if it doesn't match. Returns ""
     when the LMS supplied no name. */
  function formatLearnerName(raw) {
    raw = (raw || "").trim();
    if (!raw) return "";
    var parts = raw.split(',');
    if (parts.length === 2 && parts[0].trim() && parts[1].trim()) {
      return (parts[1].trim() + ' ' + parts[0].trim());
    }
    return raw;
  }

  var certData = null;     // { learnerName, courseTitle, scorePercent, dateStr }
  var certNameHook = null; // called with a typed name so the page can save it

  function renderCertificate(data, onNameTyped) {
    certData = data;
    certNameHook = onNameTyped || null;
    document.getElementById('cert-course').textContent = data.courseTitle;
    document.getElementById('cert-score').textContent = 'with a score of ' + data.scorePercent + '%';
    document.getElementById('cert-date').textContent = data.dateStr;
    document.getElementById('cert-name').textContent = data.learnerName || '';
  }

  /* No name from the LMS: ask for one before showing the certificate. */
  function showCertificate() {
    if (!certData) return;
    if (!certData.learnerName) {
      var form = document.getElementById('cert-name-form');
      form.classList.remove('hidden');
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById('cert-name-input').focus({ preventScroll: true });
      return;
    }
    var el = document.getElementById('certificate-view');
    el.classList.remove('hidden');
    document.getElementById('cert-actions').classList.remove('hidden');
    el.scrollIntoView({ behavior: 'smooth' });
  }

  function submitCertificateName(e) {
    e.preventDefault();
    var name = document.getElementById('cert-name-input').value.trim();
    if (!name) return;
    certData.learnerName = name;
    document.getElementById('cert-name').textContent = name;
    document.getElementById('cert-name-form').classList.add('hidden');
    if (certNameHook) certNameHook(name);
    showCertificate();
  }

  function hideCertificate() {
    document.getElementById('certificate-view').classList.add('hidden');
    document.getElementById('cert-actions').classList.add('hidden');
    document.getElementById('cert-name-form').classList.add('hidden');
  }
</script>
